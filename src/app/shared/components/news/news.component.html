<section
  class="cnews-section px-[4%] sm:px-[9.3%]"
  [class.cnews-section--from-news]="fromNews"
  [ngClass]="
    headerLayout === 'none'
      ? 'pb-8 lg:pb-12 3xl:pb-16'
      : 'py-8 lg:py-12 3xl:py-16'
  "
>
  <!-- Centered title; arrows pinned to far left / far right -->
  <div
    *ngIf="headerLayout === 'centered'"
    class="relative flex items-center justify-between w-full mb-7 3xl:mb-8 min-h-12"
  >
    <div
      class="relative z-10"
      [class.pointer-events-none]="progress.abs == 0"
      [class.opacity-60]="progress.abs == 0"
    >
      <app-button
        [size]="buttonSize"
        (click)="prevSlide()"
        icon="assets/icons/l-arrow.svg"
      ></app-button>
    </div>

    <h2
      class="pointer-events-none absolute left-1/2 top-1/2 z-0 w-[min(100%,42rem)] -translate-x-1/2 -translate-y-1/2 text-center text-3xl sm:text-4xl 3xl:text-5xl lg:leading-[40px] 3xl:leading-[57.6px] font-semibold 3xl:font-bold text-dark-gray2"
    >
      {{ title }}
    </h2>

    <div
      class="relative z-10"
      [class.pointer-events-none]="progress.abs == progress.maxIdx"
      [class.opacity-60]="progress.abs == progress.maxIdx"
    >
      <app-button
        [size]="buttonSize"
        (click)="nextSlide()"
        icon="assets/icons/r-arrow.svg"
      ></app-button>
    </div>
  </div>

  <!-- Default: title left, View All + arrows right -->
  <div
    *ngIf="headerLayout === 'default'"
    class="flex flex-col gap-6 lg:gap-0 lg:flex-row items-center justify-between mb-7 3xl:mb-8"
  >
    <div class="self-start flex flex-col gap-2 max-w-[1294px]">
      <h2
        class="text-3xl sm:text-4xl 3xl:text-5xl lg:leading-[40px] 3xl:leading-[57.6px] font-semibold 3xl:font-bold text-dark-gray2"
      >
        {{ title }}
      </h2>
      <p
        *ngIf="subtitle"
        class="text-sm sm:text-base text-dark-gray2 font-light leading-relaxed 3xl:leading-[28px]"
      >
        {{ subtitle }}
      </p>
    </div>
    <div class="self-start flex items-center gap-4 3xl:gap-6">
      <app-button
        *ngIf="showViewAll"
        [routerLink]="viewAllLink"
        [size]="buttonSize"
        [heading]="viewAllLabel"
        icon="assets/icons/r-arrow.svg"
      ></app-button>
      <div
        [class.pointer-events-none]="progress.abs == 0"
        [class.opacity-60]="progress.abs == 0"
      >
        <app-button
          [size]="buttonSize"
          (click)="prevSlide()"
          icon="assets/icons/l-arrow.svg"
        ></app-button>
      </div>
      <div
        [class.pointer-events-none]="progress.abs == progress.maxIdx"
        [class.opacity-60]="progress.abs == progress.maxIdx"
      >
        <app-button
          [size]="buttonSize"
          (click)="nextSlide()"
          icon="assets/icons/r-arrow.svg"
        ></app-button>
      </div>
    </div>
  </div>

  <div
    class="keen-slider min-h-[22rem] 3xl:min-h-[25.4rem] transition-opacity duration-300"
    [class.opacity-0]="!sliderReady"
    [class.opacity-100]="sliderReady"
    #sliderRef
  >
    <div class="keen-slider__slide" *ngFor="let blog of blogs">
      <app-news-card
        [imageUrl]="blog.imgUrl"
        [date]="blog.date"
        [title]="blog.title"
        [tags]="blog.tags"
        [navigate]="blog.link"
        [contentInset]="contentInset"
        [lineClamp]="lineClamp"
      ></app-news-card>
    </div>
  </div>
</section>
